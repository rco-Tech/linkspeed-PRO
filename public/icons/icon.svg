<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Speed gradient: Cobalt -> Cyan -> Emerald -->
    <linearGradient id="speedRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00d8ea"/>
    </linearGradient>

    <!-- Subtle squircle background -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121724"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>

    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#squircleBg)" stroke="#1e2738" stroke-width="4"/>

  <!-- Speedometer Track (Inactive Base) -->
  <path d="M 124 372 A 160 160 0 1 1 388 372"
        fill="none"
        stroke="#1a2333"
        stroke-width="26"
        stroke-linecap="round"/>

  <!-- Active Velocity Speed Arc (Sweeping up to 40 Gb/s) -->
  <path d="M 124 372 A 160 160 0 1 1 364 190"
        fill="none"
        stroke="url(#speedRingGrad)"
        stroke-width="26"
        stroke-linecap="round"/>

  <!-- Speedometer Radial Ticks -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round">
    <line x1="106" y1="346" x2="88" y2="354"/>
    <line x1="80" y1="256" x2="60" y2="256" stroke="#2563eb" stroke-width="5"/>
    <line x1="110" y1="166" x2="94" y2="150" stroke="#00d8ea" stroke-width="5"/>
    <line x1="256" y1="80" x2="256" y2="58" stroke="#00f0ff" stroke-width="6"/>
    <line x1="402" y1="166" x2="418" y2="150" stroke="#10b981" stroke-width="5"/>
    <line x1="432" y1="256" x2="452" y2="256"/>
    <line x1="406" y1="346" x2="424" y2="354"/>
  </g>

  <!-- Speed Indicator Marker at 40 Gb/s Peak -->
  <circle cx="364" cy="190" r="14" fill="#10b981"/>
  <circle cx="364" cy="190" r="6" fill="#ffffff"/>

  <!-- Central Bold Geometric Lightning Bolt (High-Speed Link Symbol) -->
  <polygon points="274,134 206,252 250,252 236,358 308,236 264,236"
           fill="url(#boltGrad)"
           filter="url(#boltGlow)"/>

  <!-- USB-C Cable Receptacle Anchor at the Base -->
  <rect x="212" y="372" width="88" height="26" rx="13" fill="#151d2c" stroke="#38bdf8" stroke-width="4"/>
  <rect x="228" y="380" width="56" height="10" rx="5" fill="#00f0ff"/>
</svg>
