<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Speed gradient from Electric Blue to Emerald -->
    <linearGradient id="flatSpeedGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Needle Gradient -->
    <linearGradient id="needleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Background squircle -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131824"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#squircleBg)" stroke="#1e2738" stroke-width="4"/>

  <!-- Speedometer Track (Inactive) -->
  <path d="M 124 372 A 162 162 0 1 1 388 372"
        fill="none"
        stroke="#1a2333"
        stroke-width="26"
        stroke-linecap="round"/>

  <!-- Active High-Speed Segment (Sweeps from 124,372 through 10G/40G) -->
  <path d="M 124 372 A 162 162 0 1 1 364 186"
        fill="none"
        stroke="url(#flatSpeedGrad)"
        stroke-width="26"
        stroke-linecap="round"/>

  <!-- Precision Tick Marks -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round">
    <line x1="106" y1="346" x2="88" y2="354"/>
    <line x1="80" y1="256" x2="60" y2="256" stroke="#2563eb" stroke-width="6"/>
    <line x1="110" y1="166" x2="94" y2="150" stroke="#00d8ea" stroke-width="6"/>
    <line x1="256" y1="80" x2="256" y2="58" stroke="#00f0ff" stroke-width="7"/>
    <line x1="402" y1="166" x2="418" y2="150" stroke="#10b981" stroke-width="6"/>
    <line x1="432" y1="256" x2="452" y2="256"/>
    <line x1="406" y1="346" x2="424" y2="354"/>
  </g>

  <!-- Dynamic Velocity Speed Needle (Pointing towards 40 Gb/s Top-Right) -->
  <!-- Center at (256, 266) -->
  <polygon points="256,252 248,274 340,152 268,260"
           fill="url(#needleGrad)"/>

  <!-- Center Hub: Precision Flat USB-C Port Capsule -->
  <!-- Outer Capsule Collar -->
  <rect x="186" y="234" width="140" height="64" rx="32" fill="#0b0e14" stroke="#00f0ff" stroke-width="7"/>

  <!-- Inner USB-C Receptacle Tongue / Pin Contact -->
  <rect x="214" y="254" width="84" height="24" rx="12" fill="#00f0ff"/>
  <rect x="226" y="260" width="60" height="12" rx="6" fill="#0b0e14"/>

  <!-- Mini Lightning / Speed Accent on the USB-C Tongue -->
  <polygon points="257,250 250,266 256,266 253,280 263,262 257,262"
           fill="#ffffff"/>
</svg>
