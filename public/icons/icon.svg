<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0070f3"/>
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="3"/>

  <!-- Speedometer Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="22" stroke-linecap="round" stroke-dasharray="750" stroke-dashoffset="180"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#speedGrad)" stroke-width="22" stroke-linecap="round" stroke-dasharray="750" stroke-dashoffset="320" filter="url(#glow)"/>

  <!-- USB-C Connector Outline in center -->
  <g transform="translate(196, 176)">
    <!-- USB-C Plug Body -->
    <rect x="10" y="10" width="100" height="140" rx="30" fill="rgba(15, 23, 42, 0.9)" stroke="url(#cyanGrad)" stroke-width="10" filter="url(#glow)"/>
    <!-- Center Contact Tongue -->
    <rect x="35" y="45" width="50" height="70" rx="14" fill="#00f0ff" opacity="0.8"/>
    <!-- Lightning/Speed Bolt -->
    <polygon points="60,20 40,80 58,80 50,130 80,70 62,70" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Speed Ticks -->
  <circle cx="130" cy="330" r="8" fill="#3b82f6"/>
  <circle cx="115" cy="256" r="8" fill="#00f0ff"/>
  <circle cx="140" cy="180" r="8" fill="#10b981"/>
  <circle cx="256" cy="100" r="10" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="370" cy="180" r="8" fill="#a855f7"/>
  <circle cx="395" cy="256" r="8" fill="#ec4899"/>

  <!-- 40 Gb/s Badge Text -->
  <text x="256" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#00f0ff" letter-spacing="2" filter="url(#glow)">LINKSPEED</text>
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="rgba(255, 255, 255, 0.6)" letter-spacing="4">USB · TB4 · PWA</text>
</svg>
